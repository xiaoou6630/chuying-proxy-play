# 只负责构建下棋引擎（三平台二进制），不负责 Java/mod 构建。
# 仅在仓库手动触发（Actions -> engines -> Run workflow），不会随 push 自动编译。
name: engines

on:
  workflow_dispatch:

jobs:
  engines:
    name: engines-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, os: windows-latest }
          - { platform: linux,   os: ubuntu-latest }
          - { platform: macos,   os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      # 组装内置引擎需要的解压工具：Linux/macOS 装 p7zip（Windows 用自带 tar.exe 即可）
      - name: Install 7z tools
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y p7zip-full
          else
            brew install p7zip
          fi
        shell: bash

      - name: Download & assemble engines
        run: bash .github/scripts/setup_engines.sh ${{ matrix.platform }}
        shell: bash

      - name: Upload engines
        uses: actions/upload-artifact@v4
        with:
          name: engines-${{ matrix.platform }}
          path: src/main/resources/engines/
          if-no-files-found: error
