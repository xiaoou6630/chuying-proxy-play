# 只做一件事：编译四个引擎的 JNI 原生库（三平台），产出可下载的产物。
#
# ⚠️ 分工：**本 workflow 不构建 jar**。jar 由本地 `gradlew build` 打包，
#    本 workflow 只负责产出 `src/main/resources/engines/` 需要的那几个 .dll/.so/.dylib。
#
# ⚠️ 临时分支约定：本 workflow 只在 `ci-tmp-*` 临时分支上跑。
#   * 手动触发时若不在临时分支，会先自动创建 `ci-tmp-<run_id>` 并 checkout；
#   * 编译完成后由 cleanup job 删除该临时分支（无论成功失败）；
#   * 想保留分支调试时，触发时勾选 keep_branch。
#
# 产物：engines-unified（三平台原生库 + 一份共享权重），30 天过期。
name: native-build

on:
  workflow_dispatch:
    inputs:
      keep_branch:
        description: '保留临时分支（调试用，默认删除）'
        type: boolean
        default: false

permissions:
  contents: write   # 需要创建/删除临时分支

concurrency:
  group: native-build-${{ github.ref }}
  # 关掉自动取消：实测同分支连发两次时，正在排队的 macOS job 会被新 run 取消，
  # 而 macOS runner 本来就要排队 10+ 分钟（startedAt=null、steps=[]、runner 为空，
  # 即「从未分配到机器就被取消」）。宁可让旧 run 跑完，也不要丢掉 macOS。
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # 0. 建临时分支
  # ------------------------------------------------------------------
  prepare:
    name: prepare-temp-branch
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.mk.outputs.branch }}
      created: ${{ steps.mk.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create temp branch
        id: mk
        run: |
          set -euo pipefail
          SRC="${GITHUB_REF_NAME}"
          if [[ "$SRC" == ci-tmp-* ]]; then
            echo "已在临时分支 $SRC 上，直接复用"
            echo "branch=$SRC"    >> "$GITHUB_OUTPUT"
            echo "created=false"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="ci-tmp-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          echo "已创建临时分支 $BRANCH（源 $SRC）"
          echo "branch=$BRANCH"   >> "$GITHUB_OUTPUT"
          echo "created=true"     >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # 1. 三平台编译原生库
  # ------------------------------------------------------------------
  build:
    name: native-${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, os: windows-latest }
          - { platform: linux,   os: ubuntu-latest }
          - { platform: macos,   os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      # JNI headers + smoke test JVM
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 7z for the Pikafish net archive (Windows uses the bundled bsdtar instead)
      - name: Install 7z
        if: matrix.platform != 'windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y p7zip-full
          else
            brew install p7zip
          fi
        shell: bash

      # Windows builds engines with MinGW-w64 gcc (MSVC breaks NNUE eval and INCBIN)
      - name: Set up MinGW-w64
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja

      - name: Build native engine libraries
        run: bash .github/scripts/build_native.sh ${{ matrix.platform }}
        shell: bash
        env:
          # 匿名 GitHub API 按 IP 限流，runner 共享 IP 常已被用光（403）；带 token 才稳
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload BEFORE smoke: artifacts survive smoke failures/hangs
      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: engines-native-${{ matrix.platform }}
          path: native/dist/
          if-no-files-found: error
          retention-days: 30

      # One step per engine: a hung engine library can then only burn its own
      # timeout, and the failing engine is obvious from the step name.
      - name: JVM smoke test (stockfish)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: bash .github/scripts/smoke_test.sh ${{ matrix.platform }} stockfish
        shell: bash

      - name: JVM smoke test (pikafish)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: bash .github/scripts/smoke_test.sh ${{ matrix.platform }} pikafish
        shell: bash

      - name: JVM smoke test (rapfi)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: bash .github/scripts/smoke_test.sh ${{ matrix.platform }} rapfi
        shell: bash

      - name: JVM smoke test (gnugo)
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: bash .github/scripts/smoke_test.sh ${{ matrix.platform }} gnugo
        shell: bash

  # ------------------------------------------------------------------
  # 2. 合并三平台 -> 一棵可直接解压进 src/main/resources/engines/ 的目录树
  #    （只整理文件，不构建 jar —— jar 在本地打）
  # ------------------------------------------------------------------
  merge:
    name: merge-all-platforms
    needs: [prepare, build]
    # 即使某个平台失败也跑：能合几个算几个，缺哪个在下面明确报出来，
    # 而不是整块 skipped 让人不知道到底缺了什么。
    if: always() && needs.prepare.outputs.branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: engines-native-*
          path: native_all

      - name: Report which platforms arrived
        run: |
          echo "=== 收到的平台 artifact ==="
          if [ -d native_all ]; then
            ls -la native_all/ || true
          else
            echo "（一个都没收到）"
          fi

      - name: Assemble unified engine tree
        run: |
          set -euo pipefail
          mkdir -p unified/shared/stockfish unified/shared/rapfi
          for d in native_all/engines-native-*/; do
            [ -d "$d" ] || continue
            plat="$(basename "$d")"; plat="${plat#engines-native-}"
            case "$plat" in
              windows) dest=windows-x86_64 ;;
              linux)   dest=linux-x86_64 ;;
              macos)   dest=macos-universal ;;
              *) echo "skip unknown $plat"; continue ;;
            esac
            mkdir -p "unified/$dest"
            find "$d" -maxdepth 1 -type f \( -name 'chuying_*' -o -name 'BUILD_INFO.txt' \) \
              -exec cp {} "unified/$dest/" \;
            echo "== $dest"; ls -la "unified/$dest"
          done

          # 权重三平台完全相同，只保留一份
          first_nets="$(ls -d native_all/engines-native-*/nets 2>/dev/null | head -1 || true)"
          if [ -n "$first_nets" ]; then
            find "$first_nets" -maxdepth 1 -name 'nn-*.nnue' -exec cp {} unified/shared/stockfish/ \;
            [ -f "$first_nets/pikafish.nnue" ] && cp "$first_nets/pikafish.nnue" unified/shared/
          fi
          echo "== shared"; ls -laR unified/shared

      - name: Verify every platform has every library
        run: |
          set -euo pipefail
          fail=0
          for plat in windows-x86_64 linux-x86_64 macos-universal; do
            if [ ! -d "unified/$plat" ]; then
              echo "::error::$plat 整个平台缺失（该平台的 build job 没产出 artifact）"
              fail=1
              continue
            fi
            for eng in stockfish pikafish rapfi gnugo; do
              f=$(ls unified/$plat/chuying_$eng.* 2>/dev/null | head -1 || true)
              [ -n "$f" ] || { echo "::error::missing $eng for $plat"; fail=1; }
            done
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "=== 已到位的平台 ==="
            ls -la unified/ || true
            echo ""
            echo "提示：macOS job 若 startedAt=null / steps=[] / runner 为空，"
            echo "      说明 GitHub 的 macos-latest runner 没分配到就失败了，重跑一次通常就好。"
            exit 1
          fi
          echo "all 3 platforms x 4 engines present"

      - name: Check total size
        run: |
          du -sh unified
          du -sh unified/* || true

      - name: Upload unified engines
        uses: actions/upload-artifact@v4
        with:
          name: engines-unified
          path: unified/
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # 3. 删除临时分支（无论成败）
  # ------------------------------------------------------------------
  cleanup:
    name: delete-temp-branch
    needs: [prepare, build, merge]
    if: always() && needs.prepare.outputs.created == 'true' && inputs.keep_branch == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete temp branch
        run: |
          set -euo pipefail
          BRANCH="${{ needs.prepare.outputs.branch }}"
          echo "删除临时分支 $BRANCH"
          git push origin --delete "$BRANCH" || echo "（分支已不存在，忽略）"
