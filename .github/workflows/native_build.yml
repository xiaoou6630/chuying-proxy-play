# JNI 进程内引擎库（chuying_stockfish/pikafish/rapfi/gnugo）三平台编译。
# 2.1 起 native/ 源码随发布树分发，因此在任意分支上**手动触发**即可复现构建。
# 只保留 workflow_dispatch：push 不再自动编译（一次三平台构建约 10 分钟，日常提交不需要）。
# 产物 90 天过期。
name: native-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: native-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, os: windows-latest }
          - { platform: linux,   os: ubuntu-latest }
          - { platform: macos,   os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      # JNI headers + smoke test JVM
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 7z for the Pikafish net archive (Windows uses the bundled bsdtar instead)
      - name: Install 7z
        if: matrix.platform != 'windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y p7zip-full
          else
            brew install p7zip
          fi
        shell: bash

      # Windows builds engines with MinGW-w64 gcc (MSVC breaks NNUE eval and INCBIN)
      - name: Set up MinGW-w64
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja

      - name: Build native engine libraries
        run: bash .github/scripts/build_native.sh ${{ matrix.platform }}
        shell: bash
        env:
          # 匿名 GitHub API 按 IP 限流，runner 共享 IP 常已被用光（403）；带 token 才稳
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload BEFORE smoke: artifacts survive smoke failures/hangs
      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: engines-native-${{ matrix.platform }}
          path: native/dist/
          if-no-files-found: error
          retention-days: 30

      # One step per engine: a hung engine library can then only burn its own
      # timeout, and the failing engine is obvious from the step name.
      - name: JVM smoke test (stockfish)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: bash .github/scripts/smoke_test.sh ${{ matrix.platform }} stockfish
        shell: bash

      - name: JVM smoke test (pikafish)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: bash .github/scripts/smoke_test.sh ${{ matrix.platform }} pikafish
        shell: bash

      - name: JVM smoke test (rapfi)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: bash .github/scripts/smoke_test.sh ${{ matrix.platform }} rapfi
        shell: bash

      - name: JVM smoke test (gnugo)
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: bash .github/scripts/smoke_test.sh ${{ matrix.platform }} gnugo
        shell: bash

